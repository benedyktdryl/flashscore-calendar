# Build, zip, optionally attach to a GitHub Release, and upload + publish to the Chrome Web Store.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
#   CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID
# Optional:
#   WXT_GOOGLE_CLIENT_ID — baked into the build if you ship OAuth mode
#
# Docs: docs/CHROME_WEB_STORE_RELEASE.md

name: Release (Chrome)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_chrome:
        description: Upload zip to Chrome Web Store and submit for review
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Optional OAuth client for manifest (store build)
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "${WXT_GOOGLE_CLIENT_ID:-}" ]; then
            echo "WXT_GOOGLE_CLIENT_ID=$WXT_GOOGLE_CLIENT_ID" >> .env
            echo "OAuth client ID will be included in the build."
          else
            echo "No WXT_GOOGLE_CLIENT_ID secret — building without OAuth in manifest."
          fi

      - name: Lint and typecheck
        run: bun run lint && bun run compile

      - name: Build production bundle
        run: bun run build

      - name: Create distributable zip
        run: bun run zip

      - name: Resolve zip path
        id: zip
        run: |
          ZIP=$(ls -1 dist/*-chrome.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "No dist/*-chrome.zip found after wxt zip" >&2
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Built: $ZIP"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-calendar-chrome-zip
          path: ${{ steps.zip.outputs.path }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload and publish on Chrome Web Store
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_to_chrome == true)
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_ID:-}" ] || [ -z "${CLIENT_SECRET:-}" ] || [ -z "${REFRESH_TOKEN:-}" ] || \
             [ -z "${EXTENSION_ID:-}" ] || [ -z "${PUBLISHER_ID:-}" ]; then
            echo "Missing one or more secrets: CHROME_CLIENT_ID, CHROME_CLIENT_SECRET," >&2
            echo "CHROME_REFRESH_TOKEN, CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID" >&2
            exit 1
          fi
          npx --yes chrome-webstore-upload-cli@4 chrome-webstore-upload \
            --source "${{ steps.zip.outputs.path }}"
