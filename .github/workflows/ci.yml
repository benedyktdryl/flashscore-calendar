# Lint and build extension + marketing site on push/PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extension
        run: |
          bun install --frozen-lockfile
          bun run lint && bun run compile && bun run build

      - name: GitHub Pages site
        working-directory: website
        env:
          VITE_SITE_URL: https://example.github.io/flashscore-calendar
          VITE_BASE_PATH: /flashscore-calendar/
        run: |
          bun install --frozen-lockfile
          bun run build
